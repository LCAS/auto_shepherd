name: Deploy Auto Shepherd website

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate website files
        run: |
          test -f docs/index.html
          test -f docs/assets/auto-shepherd-mark.png
          test -f docs/assets/pipeline-geometry.json
          test -d docs/assets/pipeline-media
          test "$(find docs/assets/pipeline-media -type f | wc -l)" -gt 0

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4